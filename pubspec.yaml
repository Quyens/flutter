name: expense_ocr_tracker
description: "Dự án theo dõi chi phí và phân tích hóa đơn thông minh bằng OCR & Heuristic Regex (Flutter & Dart)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Local Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2

  # Machine Learning / OCR (On-device)
  google_mlkit_text_recognition: ^0.13.0

  # Image Picker & Cropping
  image_picker: ^1.0.7

  # UI & Helpers
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_receipts/
